import java.security.MessageDigest

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// ---- Baritone: downloaded once into libs/, sha1-checked, never committed ----
def baritoneFile = layout.projectDirectory.file("libs/${baritone_jar}").asFile

// A task class (not a closure), so Gradle's configuration cache can serialise it.
abstract class FetchJar extends DefaultTask {
    @Input abstract Property<String> getUrl()
    @Input abstract Property<String> getSha1()
    @OutputFile abstract RegularFileProperty getTarget()

    static String sha1Of(File f) {
        def md = MessageDigest.getInstance('SHA-1')
        f.withInputStream { is ->
            byte[] buf = new byte[1 << 16]
            int n
            while ((n = is.read(buf)) > 0) md.update(buf, 0, n)
        }
        md.digest().collect { String.format('%02x', it) }.join()
    }

    @TaskAction
    void fetch() {
        File f = target.get().asFile
        if (f.exists() && sha1Of(f) == sha1.get()) return
        f.parentFile.mkdirs()
        logger.lifecycle("Downloading ${url.get()}")
        new URI(url.get()).toURL().withInputStream { is -> f.withOutputStream { os -> os << is } }
        def got = sha1Of(f)
        if (got != sha1.get()) {
            f.delete()
            throw new GradleException("Baritone jar sha1 mismatch: expected ${sha1.get()}, got ${got}")
        }
    }
}

tasks.register('fetchBaritone', FetchJar) {
    description = 'Downloads the Baritone jar the mod compiles against and checks its sha1'
    url = baritone_url
    sha1 = baritone_sha1
    target = baritoneFile
}
tasks.named('compileJava') { dependsOn 'fetchBaritone' }
tasks.named('compileTestJava') { dependsOn 'fetchBaritone' }

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            // routing review M2 (docs/PLANNING.md section 5): our injectors are require = 0 so a broken hook never stops
            // the real game; in the dev client Mixin's strict injector check fails any injector that matched nothing
            // (expect = 1), so an unapplied hook (e.g. RecorderMixinClientLevel after a Minecraft update) fails here.
            systemProperty 'mixin.debug.countInjections', 'true'
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// 'localRuntime': runtime-only dependencies of the dev runs that are not published as dependencies
// of this mod. The Baritone jar goes here so the dev client loads it as a mod next to ours.
configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    // ModDevGradle adds the NeoForged and Mojang repositories itself; Maven Central is for JUnit.
    mavenCentral()
}

dependencies {
    // Baritone's API and (for the one Mixin) its internals. Never bundled: the bot installs the same
    // official jar next to this mod.
    compileOnly files(baritoneFile)
    testCompileOnly files(baritoneFile)
    localRuntime files(baritoneFile)

    // JUnit 5 for the pure-Java unit tests (guard core, event ring, files). They use no Minecraft types.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Gson is on the Minecraft classpath in game; the unit tests need it on their own.
    testImplementation 'com.google.code.gson:gson:2.11.0'
}

tasks.named('test', Test) {
    useJUnitPlatform {
        // package H: the limit measurements (LimitsStressTest, seconds each) run only with -Pstress
        if (!project.hasProperty('stress')) excludeTags 'stress'
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

// Expands ${...} properties in src/main/templates (neoforge.mods.toml).
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            baritone_version_range : baritone_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Name and version in the jar manifest (no timestamp, so the jar hash stays reproducible).
tasks.named('jar', Jar) {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : mod_name,
                'Implementation-Version': mod_version,
                'Implementation-Vendor' : mod_authors,
        ])
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
