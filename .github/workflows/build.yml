name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test (Gradle fetches the Baritone jar and checks its sha1)
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: entropybot
          path: build/libs/entropybot-*.jar
