# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment mappings (better parameter names), see https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment Properties
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.249
neo_version_range=[21.1.249,)
loader_version_range=[4,)

# Baritone: the official unoptimized NeoForge build of the same version the bot runs. Gradle
# downloads it into libs/ and checks the sha1 from the release's checksums.txt.
baritone_version=1.11.3
baritone_version_range=[1.11.3,1.11.4)
baritone_jar=baritone-unoptimized-neoforge-1.11.3.jar
baritone_sha1=bbeb1e97b4301b67cf0ec01e5e8be62c97c56adc
baritone_url=https://github.com/cabaletta/baritone/releases/download/v1.11.3/baritone-unoptimized-neoforge-1.11.3.jar

## Mod Properties
mod_id=entropybot
mod_name=Entropy Bot
mod_license=LGPL-3.0-or-later
mod_version=0.15.1
mod_group_id=io.github.mojolowjo.entropybot
mod_authors=mojolowjo
mod_description=A client-side helper bot built on Baritone: owner-defined areas enforced as a hard fence, a fail-closed guard on every block click, path events and a file helper for scripts. Baritone only walks; the bot's own engine does the digging.
